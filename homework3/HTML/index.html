<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Pixel Art Paint</title>
    <script src="..\JS\less3.js" defer></script>
    <link rel="stylesheet" href="..\CSS\less3.css">
</head>
<body>
<div class="container">
    <h1>Pixel Paint</h1>

    <div class="d-flex controls">
        <div class="control-group">
            <label for="width">width</label>
            <input type="number" id="width" value="15" min="1" max="50">
        </div>

        <div class="control-group">
            <label for="height">height</label>
            <input type="number" id="height" value="15" min="1" max="50">
        </div>

        <div class="control-group">
            <label for="color">color</label>
            <input type="color" id="color" value="#000000">
        </div>

        <div class="control-group checkbox-group">
            <input type="checkbox" id="eraser">
            <label for="eraser">eraser</label>
        </div>

        <div class="control-group checkbox-group">
            <input type="checkbox" id="randomColor">
            <label for="randomColor">random color</label>
        </div>

        <div class="button-group">
            <button id="apply">apply</button>
            <button id="clear">Clear canvas</button>
        </div>
    </div>

    <div class="canvas-container">
        <table id="paintspace"></table>
    </div>
</div>
</body>
</html>
