<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Морський бій</title>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;700&display=swap" rel="stylesheet">
    <script src="..\JS\less3.2.js" defer></script>
    <link rel="stylesheet" href="..\CSS\less3.2.css">
</head>
<body>
<div class="notebook-page">
    <div class="container">
        <div class="doodle wave-left">
            <svg width="68" height="48" viewBox="0 0 68 48" fill="none" stroke="#1e3a8a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 28 L52 28 L44 38 L18 38 Z"/>
                <path d="M31 28 L31 8 L46 22 L31 23"/>
                <path d="M28 11 L16 23 L28 24"/>
                <path d="M6 42 Q 14 38, 22 42 T 38 42 T 54 42 T 64 42"/>
            </svg>
        </div>

        <div class="doodle wave-right">
            <svg width="56" height="52" viewBox="0 0 56 52" fill="none" stroke="#475569" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="28" cy="11" r="4"/>
                <path d="M28 15 L28 38"/>
                <path d="M19 21 L37 21"/>
                <path d="M14 30 C 14 41, 42 41, 42 30"/>
                <path d="M12 31 L14 28 L17 31"/>
                <path d="M39 31 L42 28 L44 31"/>
                <path d="M8 45 Q 18 41, 28 45 T 48 45"/>
            </svg>
        </div>

        <h1>Морський бій</h1>
        <p id="status">Розстав 20 клітинок кораблів на своєму полі</p>

        <div class="controls">
            <button id="random">
                <svg class="btn-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="3" width="18" height="18" rx="4"/>
                    <circle cx="8.5" cy="8.5" r="1.2" fill="currentColor"/>
                    <circle cx="15.5" cy="8.5" r="1.2" fill="currentColor"/>
                    <circle cx="12" cy="12" r="1.2" fill="currentColor"/>
                    <circle cx="8.5" cy="15.5" r="1.2" fill="currentColor"/>
                    <circle cx="15.5" cy="15.5" r="1.2" fill="currentColor"/>
                </svg>
                <span>Випадкова розстановка</span>
            </button>
            <button id="start" disabled>
                <svg class="btn-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="8"/>
                    <path d="M12 2 L12 6 M12 18 L12 22 M2 12 L6 12 M18 12 L22 12"/>
                </svg>
                <span id="start-text">Почати гру (0/20)</span>
            </button>
        </div>

        <div class="tables-container">
            <div class="board-wrapper">
                <h3>Твоє поле <span id="enemy-hits">(влучань бота: 0/20)</span></h3>
                <div class="table-sketch">
                    <table id="pole1"></table>
                </div>
            </div>
            <div class="board-wrapper">
                <h3>Поле супротивника <span id="player-hits">(твоїх влучань: 0/20)</span></h3>
                <div class="table-sketch">
                    <table id="pole2" class="disabled"></table>
                </div>
            </div>
        </div>
    </div>
</div>

<div id="page-curl" title="Потягни за куточок...">
    <div class="curl-under">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1e3a8a" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/>
            <line x1="12" y1="17" x2="12.01" y2="17"/>
        </svg>
    </div>
    <div class="curl-flap"></div>
</div>
</body>
</html>
